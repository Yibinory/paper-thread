name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test storage, skills and native launchers
        run: python -m unittest discover -s tests -v
      - name: Validate an empty reading library
        run: python paper.py check
      - name: Test teaching calculations
        run: node tests/test_interactions.cjs
      - name: Check formula syntax
        run: node scripts/check_math.cjs
